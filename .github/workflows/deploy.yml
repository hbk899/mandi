name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK_URL as a GitHub secret (from Render dashboard:
        # Service → Settings → Deploy Hooks → Create Hook)
        run: |
          curl -fsS --retry 3 -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    # Vercel auto-deploys from GitHub integration — this step is
    # a no-op placeholder. Remove or replace with Vercel CLI if
    # you disable the GitHub integration.
    steps:
      - name: Web deploys automatically via Vercel GitHub integration
        run: echo "Vercel watches main branch automatically. Nothing to do here."
